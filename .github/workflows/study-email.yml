name: Study Email Dispatch

on:
  schedule:
    # Runs at 11:00 UTC every day. The app checks the configured nth weekday.
    - cron: "0 11 * * *"
  workflow_dispatch:
    inputs:
      force:
        description: "Force send regardless of this month's send tracking"
        required: false
        type: boolean
        default: false

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Send study emails
        env:
          SITE_URL: ${{ secrets.SITE_URL }}
          TOKEN: ${{ secrets.STUDY_UPDATE_SEND_TOKEN }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          FORCE_INPUT="${{ inputs.force }}"
          if [ -z "$FORCE_INPUT" ]; then
            FORCE_INPUT=false
          fi
          if [ -z "$SITE_URL" ]; then
            echo "SITE_URL secret is not set."
            exit 1
          fi
          SITE_URL="${SITE_URL%/}"
          if [ "${{ github.event_name }}" = "schedule" ]; then
            if [ -z "$CRON_SECRET" ]; then
              echo "CRON_SECRET secret is not set."
              exit 1
            fi
            curl -f -sS "$SITE_URL/api/updates/study-email/dispatch" \
              -H "Authorization: Bearer $CRON_SECRET"
          else
            if [ -z "$TOKEN" ]; then
              echo "STUDY_UPDATE_SEND_TOKEN secret is not set."
              exit 1
            fi
            curl -f -sS -X POST "$SITE_URL/api/updates/study-email/dispatch" \
              -H "Authorization: Bearer $TOKEN" \
              -H "Content-Type: application/json" \
              --data "{\"force\":${FORCE_INPUT}}"
          fi
          echo ""
