name: PubMed Refresh

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

on:
  schedule:
    # Runs at 13:00 UTC every day (9am Eastern during daylight time).
    - cron: "0 13 * * *"
  workflow_dispatch:
    inputs:
      run_seo_refresh:
        description: "Also refresh SEO publication snapshots after the cache refresh"
        required: false
        type: boolean
        default: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Refresh PubMed cache
        env:
          NEXT_PUBLIC_SANITY_PROJECT_ID: ${{ secrets.NEXT_PUBLIC_SANITY_PROJECT_ID }}
          NEXT_PUBLIC_SANITY_DATASET: ${{ secrets.NEXT_PUBLIC_SANITY_DATASET }}
          SANITY_API_TOKEN: ${{ secrets.SANITY_API_TOKEN }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          TOGETHER_API_KEY: ${{ secrets.TOGETHER_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          PUBMED_DOI_ABSTRACT_BACKFILL: "true"
        run: npm run refresh:pubmed

      - name: Revalidate publication pages
        env:
          SITE_URL: ${{ secrets.SITE_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$SITE_URL" ]; then
            echo "SITE_URL secret is not set."
            exit 1
          fi
          if [ -z "$CRON_SECRET" ]; then
            echo "CRON_SECRET secret is not set."
            exit 1
          fi
          SITE_URL="${SITE_URL%/}"
          curl -f -sS -X POST "$SITE_URL/api/pubmed/revalidate" \
            -H "Authorization: Bearer $CRON_SECRET"
          echo ""

      - name: Refresh SEO publication snapshots
        env:
          SITE_URL: ${{ secrets.SITE_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          WORKFLOW_INPUT_RUN_SEO_REFRESH: ${{ inputs.run_seo_refresh }}
          SEO_REFRESH_ON_PUBMED_CRON: ${{ vars.SEO_REFRESH_ON_PUBMED_CRON }}
          GITHUB_EVENT_NAME: ${{ github.event_name }}
        run: |
          SHOULD_REFRESH_SEO=false
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ] && [ "$WORKFLOW_INPUT_RUN_SEO_REFRESH" = "true" ]; then
            SHOULD_REFRESH_SEO=true
          elif [ "${SEO_REFRESH_ON_PUBMED_CRON:-true}" = "true" ]; then
            SHOULD_REFRESH_SEO=true
          fi

          if [ "$SHOULD_REFRESH_SEO" != "true" ]; then
            echo "Skipping SEO refresh."
            exit 0
          fi
          if [ -z "$SITE_URL" ]; then
            echo "SITE_URL secret is not set."
            exit 1
          fi
          if [ -z "$CRON_SECRET" ]; then
            echo "CRON_SECRET secret is not set."
            exit 1
          fi
          SITE_URL="${SITE_URL%/}"
          curl -f -sS "$SITE_URL/api/seo/refresh" \
            -H "Authorization: Bearer $CRON_SECRET"
          echo ""
