name: PubMed Refresh

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

on:
  schedule:
    # Runs at 09:00 UTC every day so publication data is refreshed before the 11:00 UTC newsletters.
    - cron: "0 9 * * *"
  workflow_dispatch:
    inputs:
      run_seo_refresh:
        description: "Also refresh SEO publication snapshots after the cache refresh"
        required: false
        type: boolean
        default: false

concurrency:
  group: pubmed-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Refresh PubMed cache
        env:
          NEXT_PUBLIC_SANITY_PROJECT_ID: ${{ secrets.NEXT_PUBLIC_SANITY_PROJECT_ID }}
          NEXT_PUBLIC_SANITY_DATASET: ${{ secrets.NEXT_PUBLIC_SANITY_DATASET }}
          SANITY_API_TOKEN: ${{ secrets.SANITY_API_TOKEN }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          TOGETHER_API_KEY: ${{ secrets.TOGETHER_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENALEX_API_KEY: ${{ secrets.OPENALEX_API_KEY }}
          # Identifies us to PubMed and Crossref so requests are not throttled into the
          # shared anonymous pools. Crossref 429s were silently dropping publications.
          PUBMED_API_KEY: ${{ secrets.PUBMED_API_KEY }}
          CROSSREF_MAILTO: ${{ secrets.CROSSREF_MAILTO }}
          # Attributes OpenRouter usage to the site. Without it these calls were reported
          # against a localhost URL, making scheduled runs look like local development.
          SITE_URL: ${{ secrets.SITE_URL }}
          PUBMED_DOI_ABSTRACT_BACKFILL: "true"
          DOI_BROWSER_FETCH: "true"
        run: npm run refresh:pubmed

      - name: Revalidate publication pages
        env:
          SITE_URL: ${{ secrets.SITE_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$SITE_URL" ]; then
            echo "SITE_URL secret is not set."
            exit 1
          fi
          if [ -z "$CRON_SECRET" ]; then
            echo "CRON_SECRET secret is not set."
            exit 1
          fi
          SITE_URL="${SITE_URL%/}"
          curl -f -sS -X POST "$SITE_URL/api/pubmed/revalidate" \
            -H "Authorization: Bearer $CRON_SECRET"
          echo ""

      - name: Dispatch publication attribution review notifications
        env:
          SITE_URL: ${{ secrets.SITE_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$SITE_URL" ]; then
            echo "SITE_URL secret is not set."
            exit 1
          fi
          if [ -z "$CRON_SECRET" ]; then
            echo "CRON_SECRET secret is not set."
            exit 1
          fi
          SITE_URL="${SITE_URL%/}"
          curl -f -sS -X POST "$SITE_URL/api/publications/attribution-review/dispatch" \
            -H "Authorization: Bearer $CRON_SECRET" \
            -H "Content-Type: application/json" \
            --data '{}'
          echo ""

      - name: Refresh SEO publication snapshots
        env:
          SITE_URL: ${{ secrets.SITE_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          WORKFLOW_INPUT_RUN_SEO_REFRESH: ${{ inputs.run_seo_refresh }}
          SEO_REFRESH_ON_PUBMED_CRON: ${{ vars.SEO_REFRESH_ON_PUBMED_CRON }}
          GITHUB_EVENT_NAME: ${{ github.event_name }}
        run: |
          SHOULD_REFRESH_SEO=false
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            if [ "$WORKFLOW_INPUT_RUN_SEO_REFRESH" = "true" ]; then
              SHOULD_REFRESH_SEO=true
            fi
          elif [ "${SEO_REFRESH_ON_PUBMED_CRON:-true}" = "true" ]; then
            SHOULD_REFRESH_SEO=true
          fi

          if [ "$SHOULD_REFRESH_SEO" != "true" ]; then
            echo "Skipping SEO refresh."
            exit 0
          fi
          if [ -z "$SITE_URL" ]; then
            echo "SITE_URL secret is not set."
            exit 1
          fi
          if [ -z "$CRON_SECRET" ]; then
            echo "CRON_SECRET secret is not set."
            exit 1
          fi
          SITE_URL="${SITE_URL%/}"
          curl -f -sS "$SITE_URL/api/seo/refresh" \
            -H "Authorization: Bearer $CRON_SECRET"
          echo ""
