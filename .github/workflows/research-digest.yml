name: Research Digest

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

concurrency:
  group: research-digest
  queue: max
  cancel-in-progress: false

on:
  schedule:
    # Weekdays. Import selects the strongest papers; send runs afterward.
    #
    # Both scheduled jobs are gated on the RESEARCH_DIGEST_ENABLED repository variable, so
    # the digest can be switched on and off without editing this file:
    #
    #   gh variable set RESEARCH_DIGEST_ENABLED --body true    # resume
    #   gh variable set RESEARCH_DIGEST_ENABLED --body false   # pause
    #
    # or from Settings > Secrets and variables > Actions > Variables. Anything other than
    # "true" leaves the schedule paused, so an unset or mistyped value fails safe rather
    # than quietly spending tokens on LLM triage every weekday. Manual "Run workflow" runs
    # ignore the variable entirely - that is the point of it.
    - cron: "0 10 * * 1-5"
    - cron: "0 13 * * 1-5"
  workflow_dispatch:
    inputs:
      action:
        description: "Action to run"
        required: true
        type: choice
        options:
          - import
          - send
        default: import
      force:
        description: "Force send even if already sent or not approved"
        required: false
        type: boolean
        default: false

jobs:
  import:
    if: ${{ (github.event_name == 'schedule' && github.event.schedule == '0 10 * * 1-5' && vars.RESEARCH_DIGEST_ENABLED == 'true') || (github.event_name == 'workflow_dispatch' && inputs.action == 'import') }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Import research digest candidates
        env:
          NEXT_PUBLIC_SANITY_PROJECT_ID: ${{ secrets.NEXT_PUBLIC_SANITY_PROJECT_ID }}
          NEXT_PUBLIC_SANITY_DATASET: ${{ secrets.NEXT_PUBLIC_SANITY_DATASET }}
          SANITY_API_TOKEN: ${{ secrets.SANITY_API_TOKEN }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          TOGETHER_API_KEY: ${{ secrets.TOGETHER_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          PUBMED_API_KEY: ${{ secrets.PUBMED_API_KEY }}
          # Attributes OpenRouter usage to the site rather than a localhost URL.
          SITE_URL: ${{ secrets.SITE_URL }}
        run: npm run import:research-digest

  send:
    if: ${{ (github.event_name == 'schedule' && github.event.schedule == '0 13 * * 1-5' && vars.RESEARCH_DIGEST_ENABLED == 'true') || (github.event_name == 'workflow_dispatch' && inputs.action == 'send') }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Send research digest
        env:
          SITE_URL: ${{ secrets.SITE_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          SEND_TOKEN: ${{ secrets.RESEARCH_DIGEST_SEND_TOKEN }}
          FORCE_INPUT: ${{ inputs.force }}
        run: |
          if [ -z "$SITE_URL" ]; then
            echo "SITE_URL secret is not set."
            exit 1
          fi
          SITE_URL="${SITE_URL%/}"
          RESPONSE_FILE="$(mktemp)"

          if [ "${{ github.event_name }}" = "schedule" ]; then
            if [ -z "$CRON_SECRET" ]; then
              echo "CRON_SECRET secret is not set."
              exit 1
            fi
            HTTP_STATUS="$(curl -sS -o "$RESPONSE_FILE" -w "%{http_code}" \
              "$SITE_URL/api/updates/research-digest/dispatch" \
              -H "Authorization: Bearer $CRON_SECRET")"
          else
            if [ -z "$SEND_TOKEN" ]; then
              echo "RESEARCH_DIGEST_SEND_TOKEN secret is not set."
              exit 1
            fi
            FORCE="${FORCE_INPUT:-false}"
            HTTP_STATUS="$(curl -sS -o "$RESPONSE_FILE" -w "%{http_code}" \
              -X POST "$SITE_URL/api/updates/research-digest/dispatch" \
              -H "Authorization: Bearer $SEND_TOKEN" \
              -H "Content-Type: application/json" \
              --data "{\"force\":${FORCE}}")"
          fi

          RESPONSE="$(<"$RESPONSE_FILE")"
          rm -f "$RESPONSE_FILE"
          echo "$RESPONSE"
          {
            echo "## Research digest send"
            echo ""
            echo "- HTTP status: $HTTP_STATUS"
            echo ""
            echo '```json'
            echo "$RESPONSE"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

          if [ "$HTTP_STATUS" -lt 200 ] || [ "$HTTP_STATUS" -ge 300 ]; then
            exit 1
          fi
